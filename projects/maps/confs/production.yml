version: "3.9"
services:
  flower:
    build: ${PROJECT_DIR}/builds/backend
    image: maps/backend:${RAPYDO_VERSION}
    healthcheck:
      # Use a scalar: RAPyDo concatenates list overrides with the inherited test.
      test: >-
        python3 -c 'import base64, os, urllib.request;
        credentials = os.environ["FLOWER_USER"] + ":" + os.environ["FLOWER_PASSWORD"];
        authorization = "Basic " + base64.b64encode(credentials.encode()).decode();
        url = "http://127.0.0.1:" + os.environ["FLOWER_PORT"] + "/flower/";
        request = urllib.request.Request(url, headers={"Authorization": authorization});
        response = urllib.request.urlopen(request, timeout=5);
        assert response.status == 200; response.close()'
    command:
      - celery
      - --app
      - restapi.connectors.celery.worker.celery_app
      - flower
      - --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
      - --port=5555
      - --url_prefix=flower
      # - --persistent  
      # - --state_save_interval=10000
      - --db=/var/flower/flower
      - -n
      - flower_monitor
  geoserver:
    environment:
      EXTRA_JAVA_OPTS: "-DGWC_SEEDER_CORE_POOL_SIZE=${GWC_SEEDER_CORE_POOL_SIZE} -DGWC_SEEDER_MAX_POOL_SIZE=${GWC_SEEDER_MAX_POOL_SIZE} -Xms4g -Xmx8g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError -Duser.timezone=GMT -Dorg.geotools.shapefile.datetime=true -DGEOSERVER_CSRF_WHITELIST=${GEOSERVER_PROXY_BASE_URL}"
#   proxy:
#     volumes:
#       - ${PROJECT_DIR}/confs/geoserver.service:/etc/nginx/sites-enabled/geoserver.service
