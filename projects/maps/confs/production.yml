version: "3.9"
services:
  geoserver:
    environment:
      JAVA_OPTS: "-DGWC_SEEDER_CORE_POOL_SIZE=${GWC_SEEDER_CORE_POOL_SIZE} -DGWC_SEEDER_MAX_POOL_SIZE=${GWC_SEEDER_MAX_POOL_SIZE} -Xms4096m -Xmx8192m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -Duser.timezone=GMT -Dorg.geotools.shapefile.datetime=true -DGEOSERVER_CSRF_WHITELIST=${GEOSERVER_PROXY_BASE_URL}"
#   proxy:
#     volumes:
#       - ${PROJECT_DIR}/confs/geoserver.service:/etc/nginx/sites-enabled/geoserver.service