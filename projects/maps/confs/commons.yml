  geoserver:
    image: meteo-hub-geoserver:${PROJECT_VERSION}
    restart: unless-stopped
    build:
      context: ${PROJECT_DIR}/builds/geoserver
      args:
        GEOSERVER_UID: ${CURRENT_UID}
        GEOSERVER_GID: ${CURRENT_GID}
        # IMAGE_VERSION: 9.0-jdk11-openjdk-slim-buster
    # image: docker.osgeo.org/geoserver:2.26.1
    # build:
    #   context: ${PROJECT_DIR}/builds/geoserver
    #   args:
    #     GEOSERVER_UID: ${CURRENT_UID}
    #     GEOSERVER_GID: ${CURRENT_GID}
    #     IMAGE_VERSION: 9.0-jdk11-openjdk-slim-buster
    ports:
      - "8081:8080"
    stop_grace_period: 2m
    environment:
      ACTIVATE: ${ACTIVATE_GEOSERVER}
      # STABLE_EXTENSIONS: netcdf-plugin
      TOMCAT_EXTRAS: false
      EXISTING_DATA_DIR: ${GEOSERVER_EXISTING_DATA_DIR}
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      RECREATE_DATADIR: ${GEOSERVER_RECREATE_DATADIR}
      # JAVA_OPTS: "-Xms512m -Xmx1024m -Duser.timezone=GMT -Dorg.geotools.shapefile.datetime=true"
      JAVA_OPTS: "-Xms512m -Xmx1024m -Duser.timezone=GMT -Dorg.geotools.shapefile.datetime=true"
      # JAVA_OPTS: "-Xms512m -Xmx1024m -DNETCDF_DATA_DIR=/opt/geoserver_data"
    volumes:
      - ${DATA_DIR}/geoserver_data:/opt/geoserver_data
      # - ${DATA_DIR}/geoserver/settings:/settings
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS --max-time 8 http://localhost:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png -o /dev/null"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"         # Maximum log size (100 MB in this case)
        max-file: "3"           # Retain 3 log files before older ones are deleted
    networks:
      default:
        aliases:
          - geoserver.dockerized.io

  healthwatch:
    image: docker:cli
    container_name: healthwatch
    restart: unless-stopped
    environment:
      ACTIVATE: ${ACTIVATE_GEOSERVER}

    depends_on:
      - geoserver
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_DIR}/celery_health:/celery/status
    command: |
      sh -c '
      if [ "$$ACTIVATE" != "1" ]; then
        echo "GeoServer healthwatch disabled"
        exec sleep infinity
      fi
      echo "Waiting for maps-geoserver-1..."
      until docker ps > /dev/null 2>&1; do sleep 1; done
      sleep 30
      while true; do
        for CONTAINER_ID in $$(docker ps -q --filter label=com.docker.compose.service=geoserver); do
          STATUS=$$(docker inspect --format="{{.State.Health.Status}}" $$CONTAINER_ID 2>/dev/null)
          if [ "$$STATUS" = "unhealthy" ]; then
            echo "Restarting unhealthy GeoServer container $$CONTAINER_ID" >&2
            docker restart $$CONTAINER_ID
          fi
        done
        if [ -n "$$(ls -A /celery/status 2>/dev/null)" ]; then
          rm -f /celery/status/*
          for CONTAINER_ID in $$(docker ps -q --filter label=com.docker.compose.service=celery); do
            echo "Restarting stuck Celery worker $$CONTAINER_ID" >&2
            docker restart $$CONTAINER_ID
          done
        fi
        sleep 15
      done
      '
