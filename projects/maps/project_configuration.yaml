---
project:
  title: Meteo Maps
  description: "API for geo-data on a map"
  version: "0.7.0"
  rapydo: "3.0"

variables:
  env:
    ACTIVATE_AUTH: 0
    ACTIVATE_REDIS: 1
    ACTIVATE_CELERY: 1
    ACTIVATE_CELERYBEAT: 1
    CELERY_ENABLE_CONNECTOR: 1
    CELERY_BROKER: REDIS
    CELERY_BACKEND: REDIS
    FRONTEND_FRAMEWORK: nofrontend
    CORS_ALLOWED_ORIGIN: "*"
    SET_MAX_REQUESTS_PER_SECOND_API: 999999
    PLATFORM: G100
    DATA_PATH: /meteo
    HOST_WINDY_GEOTIFF_DIR: ${DATA_DIR}/maps
    HOST_SEASONAL_GEOTIFF_DIR: ${DATA_DIR}/seasonal-aim
    HOST_RADAR_DIR: ${DATA_DIR}/radar
    HOST_SUB_SEASONAL_GEOTIFF_DIR: ${DATA_DIR}/sub-seasonal-aim
    HOST_WW3_DIR: ${DATA_DIR}/maps/Windy-00-WW3.web
    RADAR_RETENTION_HOURS: 72
    SEASONAL_DATA_PATH: /seasonal-aim
    WINDY_DATA_PATH: /windy_multilayer
    WINDY_INGEST_BASE_PATH: /windy
    WINDY_INGEST_AREA: Italia
    WINDY_INGEST_FOLDERS: Windy-00-ICON_2I_all2km.web,Windy-12-ICON_2I_all2km.web
    WINDY_WRF_INGEST_FOLDERS: Windy-00-WRF.web,Windy-12-WRF.web
    HOST_MER_DIR: ${DATA_DIR}/MER
    MER_DATA_PATH: /shyfem
    RADAR_DATA_PATH: /radar
    DATASET_CONFIG_PATH: /etc/meteohub/datasets.yml
    SUB_SEASONAL_DATA_PATH: /sub-seasonal-aim
    WW3_DATA_PATH: /ww3
    STATIC_MAPS_DATA_PATH: ${DATA_DIR}/maps
    ALLOWED_IPS: {}
    GEOSERVER_PROXY_BASE_URL: maps.mistralportal.it
    GEOSERVER_GWC_ENABLED: 1
    GWC_GRID_SET: EPSG:900913_1024
    GWC_TILE_SIZE: 1024
    GWC_SEEDER_CORE_POOL_SIZE: 4
    GWC_SEEDER_MAX_POOL_SIZE: 6
    GWC_CLIENT_EXPIRE_SECONDS: 0
    GEOSERVER_DATA_PATH: /geoserver_data
    HOST_GEOSERVER_DATA_DIR: ${DATA_DIR}/geoserver_data
